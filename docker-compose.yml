version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - supermarket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  common-data-models:
    build: ./common-data-models
    image: common-data-models:latest
    container_name: common-data-models-build
    networks:
      - supermarket-network
    deploy:
      mode: global # Ensures it's available, though it's just a build container
      restart_policy:
          condition: on-failure

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - supermarket-network

  inventory-command-service:
    build:
      context: .
      dockerfile: inventory-command-service/Dockerfile
    container_name: inventory-command-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_write
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - supermarket-network

networks:
  supermarket-network:
    driver: bridge
